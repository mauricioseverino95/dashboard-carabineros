name: Clips para WhatsApp

on:
  schedule:
    - cron: "7,37 * * * *"     # cada 30 minutos
  workflow_dispatch:
    inputs:
      url:
        description: "Enlace del video a descargar (YouTube u otro). Puede pegar varios separados por espacio."
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: datos
  cancel-in-progress: false

jobs:
  clips:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar herramientas
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q -U "yt-dlp[default]"
      - name: Descargar y comprimir clips
        env:
          GH_TOKEN: ${{ github.token }}
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
          URLS: ${{ github.event.inputs.url }}
        run: python scripts/clips.py $URLS
      - name: Guardar cambios
        run: |
          git config user.name  "monitor-bot"
          git config user.email "monitor-bot@users.noreply.github.com"
          git add data/clips.json
          git diff --cached --quiet && exit 0
          git commit -m "Clips $(TZ=America/Santiago date '+%d-%m %H:%M')"
          for i in 1 2 3; do git pull --rebase -X theirs && git push && break; sleep 5; done
